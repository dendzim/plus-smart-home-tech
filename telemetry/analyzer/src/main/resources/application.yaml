spring:
  application:
    name: analyzer
  config:
    import: "configserver:"
    fail-fast: true
    retry:
      useRandomPolicy: true
      max-interval: 6000
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/