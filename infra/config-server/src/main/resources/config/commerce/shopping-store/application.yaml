server:
  port: 8083
spring:
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    hibernate:
      ddl-auto: create-drop
    datasource:
      url: jdbc:postgresql://localhost:5432/store
      username: postgres
      password: password
      driver-class-name: org.postgresql.Driver
eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
    instance-id: shopping-store:${random.value}